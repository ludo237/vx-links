<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 10px;
    }
    .result {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #1d9bf0;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #1a8cd8;
    }
    .message {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>vx-links</h1>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
